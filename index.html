<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appelo – Attendance for Google Meet™</title>
<meta name="description" content="See who joined, when and for how long. Find absent students. Export to Excel. Data stays in your browser.">
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1f2328; --muted: #5f6b7a; --accent: #1a56c8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16191d; --fg: #e6e9ee; --muted: #9aa5b4; --accent: #8ab4f8; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', sans-serif; }
  main { max-width: 560px; padding: 32px 20px; text-align: center; }
  h1 { font-size: 40px; margin: 0 0 6px; }
  p { margin: 8px 0; color: var(--muted); }
  a { color: var(--accent); }
  .links { margin-top: 26px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; }
</style>
</head>
<body>
<main>
  <h1>Appelo</h1>
  <p>Attendance for Google Meet™. See who joined, when and for how long. Find absent students. Export to Excel.</p>
  <p>Everything stays in your browser.</p>
  <div class="links"><a href="/privacy/">Privacy policy</a></div>
  <p style="font-size:14px;margin-top:30px">Appelo is not affiliated with Google. Google Meet is a trademark of Google LLC.</p>
</main>
</body>
</html>
